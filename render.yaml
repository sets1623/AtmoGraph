services:
  - type: web
    name: atmograph-api
    runtime: python
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn app.main:app --app-dir backend --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/v1/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: ATMO_DB_PATH
        value: /var/data/atmoGraph.db
    disk:
      name: atmograph-data
      mountPath: /var/data
      sizeGB: 1
